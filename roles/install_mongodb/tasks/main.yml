- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Start Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Run MongoDB container
  community.docker.docker_container:
    name: mongodb
    image: mongo:6.0
    state: started
    restart_policy: always
    ports:
      - "27017:27017"

  
