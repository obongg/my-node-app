---
- name: Copy app code
  copy:
    src: /home/ubuntu/my-node-app/
    dest: /home/ec2-user/my-node-app/
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Install app dependencies
  npm:
    path: /home/ec2-user/my-node-app/
    state: present

- name: Configure Nginx reverse proxy
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/my-node-app.conf
  notify: Restart Nginx

- name: Restart Nginx
  service:
    name: nginx
    state: restarted

